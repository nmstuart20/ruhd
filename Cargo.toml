[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/nmstuart20/ruhd"
authors = ["Nick"]

[workspace.dependencies]
# Internal crates.
ad936x = { path = "crates/ad936x", version = "0.1.0" }
chdr = { path = "crates/chdr", version = "0.1.0" }
uhd-b200 = { path = "crates/uhd-b200", version = "0.1.0" }
uhd-core = { path = "crates/uhd-core", version = "0.1.0" }
uhd-transport = { path = "crates/uhd-transport", version = "0.1.0" }

# External crates. Pinned here so every crate in the workspace agrees.
bytemuck = "1.19"
clap = { version = "4.5", features = ["derive"] }
num-complex = { version = "0.4.6", features = ["bytemuck"] }
nusb = "0.2.7"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# `ruhd images download` only. Kept out of the driver crates on purpose: a
# library that talks to hardware should not drag in a TLS stack, and nothing
# below `uhd-cli` needs to fetch anything over the network.
serde_json = "1.0"
sha2 = "0.11"
ureq = "3.3"
# Default features pull in every codec zip supports; the images archives are
# all deflate.
zip = { version = "7.2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
must_use_candidate = "warn"
# `doc_markdown` is deliberately off: this project's prose is full of hardware
# part numbers (AD936x, RFNoC, B205mini, FX3) that the lint mistakes for code
# identifiers, and backticking them all would be noise.
